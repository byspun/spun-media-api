name = "spun-media-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# KV Namespaces — create these with:
# wrangler kv:namespace create "MEDIA_CACHE"
# wrangler kv:namespace create "MEDIA_CACHE" --preview
# Then paste the IDs below
[[kv_namespaces]]
binding = "MEDIA_CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

# Secrets — set with wrangler secret put <NAME>:
# TMDB_API_KEY
# TMDB_BEARER_TOKEN
# NEON_DATABASE_URL          (pooled connection string)
# RENDER_BACKEND_URL         (Render service URL — set in Session 2)
# X_SPUN_SECRET              (shared secret for Worker ↔ Render auth)
# SUBDL_API_KEY              (SubDL subtitle API key)
# TASTEDIVE_API_KEY          (TasteDive similar content API key)

# Homepage builds use multiple metadata and catalog operations in one invocation.
# Workers Paid supports up to 10,000 subrequests per invocation; Workers Free remains capped at 50.
[limits]
cpu_ms = 30000
subrequests = 10000

[triggers]
crons = [
  "0 * * * *",    # full home build — every hour on the hour
  "15 * * * *",   # movie home — :15 past every hour
  "30 * * * *",   # tv home — :30 past every hour
  "45 * * * *",   # anime home — :45 past every hour
]
