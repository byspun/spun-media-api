components:
  securitySchemes:
    UserKey:
      type: apiKey
      in: header
      name: X-User-Key
      description: Protected public-route credential in the form spn_<random-alphanumeric>.
    AdminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: Operator credential for administration and public-route testing.
    InternalsKey:
      type: apiKey
      in: header
      name: X-Internals-Key
      description: Trusted Worker-to-service credential.
    LogUploadKey:
      type: apiKey
      in: header
      name: X-Log-Upload-Key
      description: Optional dedicated credential for the administrative log-upload route.
    UserSession:
      type: http
      scheme: bearer
      bearerFormat: session
      description: Spün Auth customer session. The current v1 adapter fails closed until configured.

  parameters:
    SpunId:
      name: spunId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*-[0-9]{6}$'
      description: Canonical Spün ID in title-slug-XXXXXX form.
    Namespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
      description: External identifier namespace, such as tmdb, imdb, tvdb, anilist, mal, kitsu, or moviebox.
    ExternalId:
      name: id
      in: query
      required: true
      schema:
        type: string
      description: Identifier in the selected resolver namespace.
    SearchQuery:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 2
      description: Search text. Spaces and punctuation are supported.
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 1
    LimitOptional:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    ContentType:
      name: type
      in: path
      required: true
      schema:
        type: string
        enum: [movie, tv, anime]
    ContentTypeOptional:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum: [movie, tv, anime]
    SearchType:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum: [all, movie, tv, anime]
        default: all
    DiscoveryType:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum: [all, movie, tv, anime]
        default: all
    GenreTypeOptional:
      name: type
      in: query
      required: false
      schema:
        type: string
