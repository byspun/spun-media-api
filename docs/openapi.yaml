openapi: 3.1.0
info:
  title: Spün Media API
  version: 1.0.0
  description: |
    Spün Media API is a universal media provider for movie, television, and anime
    applications. It unifies metadata, discovery, content mapping, streaming,
    downloads, subtitles, proxy delivery, administration, and provider orchestration
    behind one consistent API.

    The public Worker base path is /v1. The hosted Spün instance is provided as a
    reference; source-code users should deploy their own Worker, providers service,
    database, cache, credentials, and supporting MovieBox service.
  contact:
    url: https://byspun.xyz
  license:
    name: See repository licence terms
    url: https://github.com/heisdanny64/spun-media-api
servers:
  - url: https://media.byspun.xyz/v1
    description: Hosted Spün Media API v1
  - url: https://{workerHost}/v1
    description: Self-hosted metadata Worker
    variables:
      workerHost:
        default: api.example.com
        description: Hostname of the self-hosted metadata Worker

tags:
  - name: Health
  - name: Search
  - name: Metadata
  - name: Discovery
  - name: Anime
  - name: Similar
  - name: Streaming
  - name: Downloads
  - name: Subtitles
  - name: Resolver
  - name: Home
  - name: Franchises
  - name: Proxy
  - name: Administration
  - name: Account
  - name: Internal
  - name: Providers

paths:
  /health:
    get:
      tags: [Health]
      summary: Check API and dependency health
      operationId: getHealthAlias
      description: Redirects with HTTP 307 to /utility/health.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
        '307':
          description: Redirect to the canonical health route.
          headers:
            Location:
              schema:
                type: string

  /utility/health:
    get:
      tags: [Health]
      summary: Check API and dependency health
      operationId: getUtilityHealth
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceOffline'

  /resolve:
    get:
      tags: [Resolver]
      summary: List supported resolver namespaces
      operationId: listResolverNamespacesAlias
      description: Redirects with HTTP 307 to /utility/resolve.
      security:
        - UserKey: []
        - AdminKey: []
      responses:
        '200':
          $ref: '#/components/responses/GenericJson'
        '307':
          description: Redirect to the canonical resolver namespace route.
          headers:
            Location:
              schema:
                type: string

  /utility/resolve:
    get:
      tags: [Resolver]
      summary: List supported resolver namespaces
      operationId: listResolverNamespaces
      security:
        - UserKey: []
        - AdminKey: []
      responses:
        '200':
          description: Supported resolver namespaces.
          content:
            application/json:
              schema:
                type: object
                required: [supported]
                properties:
                  supported:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /resolve/{namespace}:
    get:
      tags: [Resolver]
      summary: Resolve an external identifier
      operationId: resolveAlias
      description: Redirects with HTTP 307 to /utility/resolve/{namespace}.
      security:
        - UserKey: []
        - AdminKey: []
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/ExternalId'
        - $ref: '#/components/parameters/ContentTypeOptional'
      responses:
        '200':
          $ref: '#/components/responses/ContentItemResponse'
        '307':
          description: Redirect to the canonical resolver route.
          headers:
            Location:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ResolveNotFound'

  /utility/resolve/{namespace}:
    get:
      tags: [Resolver]
      summary: Resolve an external identifier
      operationId: resolveIdentifier
      security:
        - UserKey: []
        - AdminKey: []
      parameters:
        - $ref: '#/components/parameters/Namespace'
        - $ref: '#/components/parameters/ExternalId'
        - $ref: '#/components/parameters/ContentTypeOptional'
      responses:
        '200':
          $ref: '#/components/responses/ContentItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ResolveNotFound'
        '409':
          $ref: '#/components/responses/ResolveConflict'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

