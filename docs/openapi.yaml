  schemas:
    ErrorBody:
      type: object
      required: [code, error, description, action]
      properties:
        code:
          type: string
        error:
          type: string
        description:
          type: string
        action:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    GenericJson:
      type: object
      additionalProperties: true
    ContentItem:
      type: object
      additionalProperties: true
      properties:
        spun_id:
          type: string
        type:
          type: string
          enum: [movie, tv, anime]
        title:
          type: string
        year:
          type: integer
          nullable: true
        rating:
          type: number
          nullable: true
        poster:
          type: string
          nullable: true
    ContentItemResponse:
      allOf:
        - $ref: '#/components/schemas/ContentItem'
    SearchResponse:
      type: object
      required: [results]
      properties:
        page:
          type: integer
        total_pages:
          type: integer
        total_results:
          type: integer
        total_pages_exact:
          type: boolean
        total_results_exact:
          type: boolean
        results:
          type: array
          items:
            $ref: '#/components/schemas/ContentItem'
    DiscoverResponse:
      type: object
      required: [page, has_more, results]
      properties:
        page:
          type: integer
        has_more:
          type: boolean
        results:
          type: array
          items:
            $ref: '#/components/schemas/ContentItem'
    StreamOption:
      type: object
      additionalProperties: true
      properties:
        quality:
          type: string
        format:
          type: string
        audio:
          type: string
        url:
          type: string
          format: uri
    StreamResponse:
      type: object
      required: [spun_id, streams, subtitles]
      properties:
        spun_id:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [movie, tv, anime]
        streams:
          type: array
          items:
            $ref: '#/components/schemas/StreamOption'
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleTrack'
    DownloadOption:
      allOf:
        - $ref: '#/components/schemas/StreamOption'
        - type: object
          properties:
            filename:
              type: string
            size:
              type: string
    DownloadResponse:
      type: object
      required: [spun_id, downloads, subtitles]
      properties:
        spun_id:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [movie, tv, anime]
        downloads:
          type: array
          items:
            type: object
            additionalProperties: true
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleTrack'
    SubtitleTrack:
      type: object
      additionalProperties: true
      properties:
        language:
          type: string
        language_code:
          type: string
        label:
          type: string
        format:
          type: string
          enum: [vtt]
        url:
          type: string
          format: uri
    HealthResponse:
      type: object
      additionalProperties: true
      required: [status, services]
      properties:
        status:
          type: string
          enum: [ok, degraded, down, unknown]
        services:
          type: object
          additionalProperties:
            type: string
    AccountCreateRequest:
      type: object
      required: [auth_subject]
      properties:
        auth_subject:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          nullable: true
        name:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, closed]
          default: active
    AccountSyncRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          nullable: true
        name:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, closed]
    ApiKeyGenerateRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Null means the key does not expire automatically. Omit to use the active policy default.
    ApiKeyRevokeRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    LogUploadRequest:
      type: object
      required: [service, date, content]
      properties:
        service:
          type: string
          enum: [metadata, providers]
        date:
          type: string
          format: date
        content:
          type: string
          description: Log content. The request is limited to 5 MiB.

  responses:
    GenericJson:
      description: JSON response defined by the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericJson'
    HealthResponse:
      description: Health status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthResponse'
    SearchResponse:
      description: Search results.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchResponse'
    DiscoverResponse:
      description: Discovery results.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscoverResponse'
    ContentItemResponse:
      description: Unified content item.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ContentItemResponse'
    StreamResponse:
      description: Normalized streams and subtitle tracks.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StreamResponse'
    DownloadResponse:
      description: Normalized downloads and downloadable subtitle tracks.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DownloadResponse'
    SubtitleResponse:
      description: Subtitle tracks with ready-to-use VTT URLs.
      content:
        application/json:
          schema:
            type: object
            required: [spun_id, subtitles]
            properties:
              spun_id:
                type: string
              subtitles:
                type: array
                items:
                  $ref: '#/components/schemas/SubtitleTrack'
    AccountCreated:
      description: Account created.
      content:
        application/json:
          schema:
            type: object
            required: [success, action, account]
            properties:
              success:
                type: boolean
              action:
                type: string
              account:
                type: object
                additionalProperties: true
    AccountSync:
      description: Account synchronized.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    ApiKeyCreated:
      description: API key generated. The full key is returned only once.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Error:
      description: Structured API error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: Invalid request, parameter, or body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UserAuthRequired:
      description: Spün Auth customer session required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated caller is not permitted to perform the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidId:
      description: Spün ID does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InvalidStudio:
      description: Studio does not exist or is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ResolveNotFound:
      description: Resolver namespace or content was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ResolveConflict:
      description: Resolver conflict or ambiguous registration.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UpstreamError:
      description: Upstream service failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GatewayTimeout:
      description: Upstream metadata operation timed out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceOffline:
      description: Required infrastructure is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    StreamsUnavailable:
      description: No playable stream was found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    DownloadsUnavailable:
      description: No usable download was found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ProxyTokenInvalid:
      description: Proxy token is invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ProxyUpstreamNotAllowed:
      description: Upstream target failed proxy safety validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ProxyManifestTooLarge:
      description: HLS manifest exceeded proxy limits.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ProxyUpstreamUnavailable:
      description: Approved upstream media source is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: Request body exceeded the endpoint limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AccountNotFound:
      description: Account does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AccountConflict:
      description: Account identity conflicts with an existing record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ApiKeyNotFound:
      description: API key does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    KeyAlreadyRevoked:
      description: API key has already been revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
