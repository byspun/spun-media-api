name = "spun-media-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Production KV namespace used by the deployed Worker.
[[kv_namespaces]]
binding = "MEDIA_CACHE"
id = "92b74f9efcef49b7834466a0f031ee95"

# Secrets — set with wrangler secret put <NAME>:
# TMDB_API_KEY
# TMDB_BEARER_TOKEN
# NEON_DATABASE_URL          (pooled connection string)
# RENDER_BACKEND_URL         (Render service URL — set in Session 2)
# INTERNALS_KEY              (shared secret for Worker ↔ Render auth)
# ADMIN_KEY                  (administrator key for /v1/admin and public-route testing)
# LOG_UPLOAD_KEY             (dedicated key accepted for automated log uploads)
# SPUN_AUTH_VERIFY_URL       (optional placeholder for Spün Auth verification)
# SPUN_AUTH_VERIFY_KEY       (optional verification credential)
# BILLING_ENABLED            (set false until billing is ready)
# SUBSCRIPTIONS_ENABLED      (set false until subscription enforcement is ready)
# PLANS_ENABLED              (set false until plan enforcement is ready)
# QUOTA_MODE                 (off, observe, or enforce)
# RATE_LIMIT_MODE            (off, observe, or enforce)
# SUBDL_API_KEY              (SubDL subtitle API key)
# TASTEDIVE_API_KEY          (TasteDive similar content API key)

[triggers]
crons = [
  "0 * * * *",    # full home build — every hour on the hour
  "15 * * * *",   # movie home — :15 past every hour
  "30 * * * *",   # tv home — :30 past every hour
  "45 * * * *",   # anime home — :45 past every hour
]
