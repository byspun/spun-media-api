services:
  - type: web
    name: spun-media-providers
    runtime: node
    rootDir: providers
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MOVIEBOX_API_BASE
        value: https://moviebox.byspun.xyz
      - key: PORT
        value: 10000
      - key: INTERNALS_KEY
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: LOG_UPLOAD_URL
        value: https://media.byspun.xyz/v1/admin/logs/upload
      - key: LOG_UPLOAD_KEY
        sync: false
      - key: MOVIEBOX_API_SECRET
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: DARATECH_API_BASE
        value: https://apimovie.runflix.name.ng/v1
      - key: DARATECH_API_KEY
        sync: false
      - key: BILLING_ENABLED
        value: 'false'
      - key: SUBSCRIPTIONS_ENABLED
        value: 'false'
      - key: PLANS_ENABLED
        value: 'false'
      - key: QUOTA_MODE
        value: off
      - key: RATE_LIMIT_MODE
        value: off
